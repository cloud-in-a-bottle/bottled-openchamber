# Shared proxy directives for the OpenChamber upstream.
#
# The OpenHost router strips the original Host header (the app sees
# Host: 127.0.0.1:8080). We forward the real external host + https
# scheme so any absolute URLs OpenChamber emits are correct.

proxy_http_version 1.1;

# WebSocket / connection-upgrade plumbing. OpenChamber streams the agent
# event feed, the built-in terminal (ghostty-web), dictation, and the
# preview/realtime proxies over WebSockets under /api/*/ws.
# $connection_upgrade is "upgrade" when the client sends an Upgrade
# header, else "close".
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Pass the external-facing host + scheme through to OpenChamber.
proxy_set_header Host              $forward_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host  $forward_host;

# Don't buffer streaming responses. OpenChamber serves SSE at
# /api/event, /api/global/event, /api/openchamber/events, etc. and sets
# its own gzip; disabling proxy buffering keeps live updates + terminal
# output flowing without delay. (OpenChamber gzips >1KB itself, so we do
# not add gzip here.)
proxy_buffering off;
proxy_request_buffering off;
